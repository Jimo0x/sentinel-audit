name: build

# Produces native Windows + Linux binaries. Runs on every push to a tag like
# v0.4.0 (and can be triggered manually), uploading the executables as artifacts
# and attaching them to a GitHub Release on tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sentinel-linux
          - os: windows-latest
            artifact: sentinel-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview PyYAML

      - name: Run tests
        run: |
          pip install pytest
          pytest -q

      - name: Build CLI
        run: pyinstaller --noconfirm --distpath dist --workpath build/cli packaging/sentinel-cli.spec

      - name: Build desktop GUI
        run: pyinstaller --noconfirm --distpath dist --workpath build/gui packaging/sentinel-gui.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/sentinel*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sentinel*
